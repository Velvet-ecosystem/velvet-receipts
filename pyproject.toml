[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velvet-receipts"
version = "1.2.0"
description = "Deterministic append-only receipt chains for the Velvet ecosystem"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
dependencies = []

[tool.setuptools]
py-modules = [
  "receipt",
  "receipt_logger",
  "runtime_receipts",
  "audio_output_receipts",
  "learning_session_receipts",
  "ghost_can_receipts",
  "distributed_work_receipts",
  "memory_link",
  "memory_retrieval_receipt",
]
packages = ["velvet_receipts"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velvet-receipts"
version = "1.0.1"
description = "Deterministic append-only receipt chains for the Velvet ecosystem"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
dependencies = []

[tool.setuptools]
py-modules = ["receipt", "receipt_logger"]
packages = ["velvet_receipts"]
